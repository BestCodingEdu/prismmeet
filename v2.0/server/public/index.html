<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrismMeet · 棱镜会议</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232681ff'/%3E%3Cpath d='M5 8h9v8H5z' fill='white'/%3E%3Cpath d='M15 10l4-2v8l-4-2z' fill='white'/%3E%3C/svg%3E" />
</head>
<body>
  <!-- ===== Auth view (split screen) ===== -->
  <div id="authView" class="auth-wrap hidden">
    <div class="auth-visual">
      <div class="vbrand">
        <span class="dot"><svg viewBox="0 0 24 24"><path d="M3 6h11v12H3z"/><path d="M15 9l5-3v12l-5-3z"/></svg></span>
        <b>PrismMeet</b>
      </div>
      <h1>让每一次远程会议<br>简单而高效</h1>
      <p>多人音视频、高清屏幕共享、主持人管控——完全免费、开源、安全。会议本应如此纯粹。</p>
      <div class="vfeats">
        <span class="vfeat"><svg viewBox="0 0 24 24"><path d="M9 16.2l-3.5-3.5L4 14.2 9 19l11-11-1.5-1.5z"/></svg> 多人会议</span>
        <span class="vfeat"><svg viewBox="0 0 24 24"><path d="M9 16.2l-3.5-3.5L4 14.2 9 19l11-11-1.5-1.5z"/></svg> 屏幕共享</span>
        <span class="vfeat"><svg viewBox="0 0 24 24"><path d="M9 16.2l-3.5-3.5L4 14.2 9 19l11-11-1.5-1.5z"/></svg> 免费开源</span>
      </div>
    </div>

    <div class="auth-form-side">
      <!-- login -->
      <div class="auth-card" id="loginForm">
        <h2>欢迎回来</h2>
        <div class="sub">手机号 + 密码 / 短信验证码登录</div>
        <div class="err-msg" id="loginErr"></div>
        <div class="login-tabs" style="display:flex;gap:8px;margin-bottom:14px">
          <button type="button" id="tabPwd" class="login-tab" style="flex:1;padding:8px;border:1px solid #d0d3da;border-radius:8px;background:#eef1ff;font-weight:600;cursor:pointer">密码登录</button>
          <button type="button" id="tabCode" class="login-tab" style="flex:1;padding:8px;border:1px solid #d0d3da;border-radius:8px;background:#f6f7fa;cursor:pointer">短信验证码登录</button>
        </div>
        <!-- password mode -->
        <div id="loginPwdMode">
          <div class="field"><label>账号</label><input id="loginId" type="text" placeholder="手机号（老用户可用邮箱/昵称）" /></div>
          <div class="field"><label>密码</label>
            <div class="pwd-wrap"><input id="loginPass" type="password" placeholder="请输入密码" /><button type="button" class="pwd-eye" data-for="loginPass">👁</button></div>
          </div>
          <div style="text-align:right;margin:-6px 0 12px"><a href="#" id="toForgot" style="font-size:13px">忘记密码？</a></div>
        </div>
        <!-- sms-code mode -->
        <div id="loginCodeMode" class="hidden">
          <div class="field"><label>手机号</label><input id="loginCodePhone" type="text" inputmode="numeric" maxlength="11" placeholder="11 位手机号" /></div>
          <div class="field"><label>短信验证码</label>
            <div class="code-row"><input id="loginCode" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码" /><button type="button" class="btn-code" id="loginSendCode">获取验证码</button></div>
          </div>
        </div>
        <button class="btn-primary" id="loginBtn">登录</button>
        <div class="auth-switch">还没有账号？<a href="#" id="toRegister">立即注册</a></div>
      </div>

      <!-- register -->
      <div class="auth-card hidden" id="registerForm">
        <h2>创建账号</h2>
        <div class="sub">手机号注册 · 短信验证</div>
        <div class="err-msg" id="regErr"></div>
        <div class="field"><label>手机号</label><input id="regPhone" type="text" inputmode="numeric" maxlength="11" placeholder="11 位手机号" /><small class="hint" id="hPhone"></small></div>
        <div class="field"><label>短信验证码</label>
          <div class="code-row"><input id="regCode" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码" /><button type="button" class="btn-code" id="regSendCode">获取验证码</button></div>
          <small class="hint" id="hCode"></small>
        </div>
        <div class="field"><label>显示名（会议中显示的名字）</label><input id="regUsername" type="text" placeholder="如 张三" /><small class="hint" id="hUser"></small></div>
        <div class="field"><label>密码</label>
          <div class="pwd-wrap"><input id="regPass" type="password" placeholder="至少 6 位" /><button type="button" class="pwd-eye" data-for="regPass">👁</button></div>
          <small class="hint" id="hPass"></small>
        </div>
        <div class="field"><label>确认密码</label>
          <div class="pwd-wrap"><input id="regPass2" type="password" placeholder="再次输入密码" /><button type="button" class="pwd-eye" data-for="regPass2">👁</button></div>
          <small class="hint" id="hPass2"></small>
        </div>
        <button class="btn-primary" id="regBtn">注册</button>
        <div class="auth-switch">已有账号？<a href="#" id="toLogin">返回登录</a></div>
      </div>

      <!-- forgot password -->
      <div class="auth-card hidden" id="forgotForm">
        <h2>重置密码</h2>
        <div class="sub">通过手机短信验证后设置新密码</div>
        <div class="err-msg" id="fgErr"></div>
        <div class="field"><label>注册手机号</label><input id="fgPhone" type="text" inputmode="numeric" maxlength="11" placeholder="11 位手机号" /></div>
        <div class="field"><label>短信验证码</label>
          <div class="code-row"><input id="fgCode" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码" /><button type="button" class="btn-code" id="fgSendCode">获取验证码</button></div>
        </div>
        <div class="field"><label>新密码</label>
          <div class="pwd-wrap"><input id="fgPass" type="password" placeholder="至少 6 位" /><button type="button" class="pwd-eye" data-for="fgPass">👁</button></div>
          <small class="hint" id="hFgPass"></small>
        </div>
        <div class="field"><label>确认新密码</label>
          <div class="pwd-wrap"><input id="fgPass2" type="password" placeholder="再次输入新密码" /><button type="button" class="pwd-eye" data-for="fgPass2">👁</button></div>
          <small class="hint" id="hFgPass2"></small>
        </div>
        <button class="btn-primary" id="fgBtn">重置密码</button>
        <div class="auth-switch"><a href="#" id="toLogin2">返回登录</a></div>
      </div>
    </div>
  </div>

  <!-- ===== Home view ===== -->
  <div id="homeView" class="home hidden">
    <div class="home-top">
      <div class="brand-logo">
        <span class="dot"><svg viewBox="0 0 24 24"><path d="M3 6h11v12H3z"/><path d="M15 9l5-3v12l-5-3z"/></svg></span>
        <b>PrismMeet</b>
      </div>
      <div class="spacer"></div>
      <div class="user-chip">
        <span class="avatar" id="homeAvatar">U</span>
        <span id="homeName">用户</span>
        <button class="link-btn" id="logoutBtn">退出登录</button>
      </div>
    </div>
    <div class="home-body">
      <div class="greeting">
        <h1 id="greetHi">你好 👋</h1>
        <p id="greetSub">选择一种方式，开始你的会议</p>
      </div>
      <div class="actions">
        <button class="action-card join" id="cardJoin">
          <span class="ico"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5v3H3v4h7z"/><path d="M14 3h5a2 2 0 012 2v14a2 2 0 01-2 2h-5v-2h5V5h-5z"/></svg></span>
          <span class="t">加入会议</span><span class="d">输入会议号加入</span>
        </button>
        <button class="action-card quick" id="cardQuick">
          <span class="ico"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h7l-1 8 10-12h-7z"/></svg></span>
          <span class="t">快速会议</span><span class="d">立即发起会议</span>
        </button>
        <button class="action-card book" id="cardBook">
          <span class="ico"><svg viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 00-2 2v13a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2h-2V2h-2v2H9V2H7zm12 7v10H5V9h14z"/></svg></span>
          <span class="t">预定会议</span><span class="d">创建并命名会议</span>
        </button>
      </div>
    </div>
  </div>

  <!-- join modal -->
  <div id="joinModal" class="modal-mask hidden">
    <div class="modal">
      <h3>加入会议</h3>
      <div class="err-msg" id="joinErr"></div>
      <div class="field"><label>会议号</label><input id="joinId" type="text" inputmode="numeric" placeholder="粘贴邀请信息或输入 9 位会议号" /></div>
      <div class="field"><label>你的昵称</label><input id="joinName" class="name-in" type="text" placeholder="会议中显示的名字" /></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="joinCancel">取消</button>
        <button class="btn-primary" id="joinGo">加入</button>
      </div>
    </div>
  </div>

  <!-- 进入/创建会议加载浮层 -->
  <div id="enterLoading" class="enter-loading hidden">
    <div class="el-box">
      <div class="el-spinner"></div>
      <div class="el-title" id="elTitle">正在进入会议…</div>
      <div class="el-id" id="elId"></div>
    </div>
  </div>

  <script type="module" src="/js/home.js"></script>
</body>
</html>
