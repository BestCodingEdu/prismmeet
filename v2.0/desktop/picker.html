<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>选择共享内容</title>
  <style>
    html, body { height:100%; }
    body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:#232427; color:#e6e6e6; display:flex; flex-direction:column; overflow:hidden; }
    h3 { padding:14px 18px; margin:0; font-size:15px; border-bottom:1px solid #2e2f33; flex-shrink:0; }
    .tabs { display:flex; gap:8px; padding:10px 18px; flex-shrink:0; }
    .tabs button { background:#2c2e33; color:#cfd2d6; border:none; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px; }
    .tabs button.active { background:#2681ff; color:#fff; }
    /* scrollable area; items sized to content (no vertical stretch) */
    .grid { flex:1; min-height:0; display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:12px 18px; overflow-y:auto; align-content:start; grid-auto-rows:max-content; }
    .src { background:#2c2e33; border-radius:8px; overflow:hidden; cursor:pointer; border:2px solid transparent; height:max-content; }
    .src:hover { border-color:#2681ff; }
    .src img { width:100%; height:108px; object-fit:cover; background:#000; display:block; }
    .src .nm { padding:6px 8px; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .foot { display:flex; align-items:center; justify-content:flex-end; gap:10px; padding:12px 18px; border-top:1px solid #2e2f33; flex-shrink:0; }
    .foot button { padding:8px 18px; border:none; border-radius:6px; cursor:pointer; font-size:13px; }
    .cancel { background:#3a3c42; color:#cfd2d6; }
    .ok { background:#2681ff; color:#fff; }
    .ok:disabled { opacity:.5; cursor:not-allowed; }
  </style>
</head>
<body>
  <h3>选择要共享的内容</h3>
  <div class="tabs">
    <button id="tScreen" class="active">整个屏幕</button>
    <button id="tWindow">应用窗口</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="foot">
    <label style="margin-right:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:#cfd2d6;cursor:pointer;">
      <input type="checkbox" id="sysAudio"> 同时共享电脑声音
    </label>
    <button class="cancel" id="cancel">取消</button>
    <button class="ok" id="ok" disabled>开始共享</button>
  </div>
  <script>
    let all = [], filter = 'screen', selected = null;
    const audioOn = () => document.getElementById('sysAudio').checked;
    const pick = (id) => window.PM_DESKTOP.choose(id ? { id, audio: audioOn() } : null);
    const grid = document.getElementById('grid');
    function render() {
      grid.innerHTML = '';
      all.filter(s => filter === 'screen' ? s.id.startsWith('screen') : s.id.startsWith('window'))
        .forEach(s => {
          const el = document.createElement('div'); el.className = 'src';
          el.innerHTML = `<img src="${s.thumb}"><div class="nm">${s.name}</div>`;
          el.onclick = () => { selected = s.id; [...grid.children].forEach(c => c.style.borderColor='transparent'); el.style.borderColor='#2681ff'; document.getElementById('ok').disabled=false; };
          el.ondblclick = () => pick(s.id);
          grid.appendChild(el);
        });
    }
    window.PM_DESKTOP.onSources((list) => { all = list; render(); });
    document.getElementById('tScreen').onclick = function(){ filter='screen'; this.classList.add('active'); document.getElementById('tWindow').classList.remove('active'); selected=null; document.getElementById('ok').disabled=true; render(); };
    document.getElementById('tWindow').onclick = function(){ filter='window'; this.classList.add('active'); document.getElementById('tScreen').classList.remove('active'); selected=null; document.getElementById('ok').disabled=true; render(); };
    document.getElementById('ok').onclick = () => { if (selected) pick(selected); };
    document.getElementById('cancel').onclick = () => pick(null);
  </script>
</body>
</html>
