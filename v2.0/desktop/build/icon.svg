<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b6fff"/>
      <stop offset="1" stop-color="#27c0ff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0b2e6b" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- rounded-square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#sheen)"/>

  <!-- prism light rays (the "Prism" motif) -->
  <g opacity="0.9" stroke-linecap="round">
    <line x1="300" y1="512" x2="690" y2="360" stroke="#ffd166" stroke-width="14"/>
    <line x1="300" y1="512" x2="700" y2="512" stroke="#ff7a8a" stroke-width="14"/>
    <line x1="300" y1="512" x2="690" y2="664" stroke="#7CF5C8" stroke-width="14"/>
  </g>

  <!-- camera / video mark (consistent with in-app logo), white -->
  <g filter="url(#sh)">
    <rect x="250" y="372" width="320" height="280" rx="46" fill="#ffffff"/>
    <path d="M600 432 L760 360 V664 L600 592 Z" fill="#ffffff"/>
    <!-- play triangle inside the camera body -->
    <path d="M372 462 L372 562 L452 512 Z" fill="#2b6fff"/>
  </g>
</svg>
